# Vérifications à chaque envoi : compilation, tests Rust avec les vrais outils
# (ffmpeg, 7-Zip, LibreOffice) et tests de bout en bout de la version web.

name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Outils
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            ffmpeg 7zip libreoffice-writer-nogui libreoffice-calc-nogui libreoffice-impress-nogui libreoffice-draw-nogui
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Textes générés à jour
        run: |
          node --experimental-strip-types --no-warnings scripts/generate-legal.mts
          git diff --exit-code -- LEGAL.md THIRD-PARTY-NOTICES.md scripts/install.sh src-tauri/windows/license-installer.txt src-tauri/linux/arac.desktop
      - run: npm run build
      - name: Tests Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Tests web
        run: |
          npm run build:web
          npm i --no-save playwright@1
          npx playwright install --with-deps chromium
          npm test
