# Fabrique tous les fichiers d'installation d'Araç et prépare une publication
# GitHub (brouillon, à publier à la main) :
#   Windows x64 / ARM64 (.exe), Linux x86_64 / ARM64 / ARM 32 bits (.deb, .rpm,
#   .AppImage), script .sh, version web (.zip), code source, sommes SHA-256.
#
# Lancement : pousser une étiquette « v0.1 » (git tag v0.1 && git push origin v0.1)
# ou bouton « Run workflow » dans l'onglet Actions.

name: Installateurs

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    name: Web, script .sh et code source
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(grep -oP "APP_VERSION = '\K[^']+" src/version.ts)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Textes légaux et script .sh à jour
        run: node --experimental-strip-types --no-warnings scripts/generate-legal.mts
      - run: npm run build:web
      - name: Fichiers
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          mkdir -p out
          (cd dist-web && zip -qr "../out/Arac_${V}_web.zip" .)
          cp scripts/install.sh "out/Arac_${V}_install.sh"
          git archive --format=tar.gz --prefix="arac-${V}/" -o "out/Arac_${V}_source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: out/*

  windows:
    name: Windows ${{ matrix.arch }}
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: ffmpeg, 7-Zip et LibreOffice
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/prepare-windows.ps1 -Arch ${{ matrix.arch }}
      - name: Installateur
        run: npx tauri build --bundles nsis --config src-tauri/release-windows.json
      - name: Renommage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $exe.FullName "out/Arac_${{ needs.web.outputs.version }}_windows_${{ matrix.arch }}-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: out/*

  linux:
    name: Linux ${{ matrix.arch }}
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances de Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 file
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Paquets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/ci-build-linux.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: out/*

  linux-armhf:
    name: Linux armhf (32 bits)
    needs: web
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm
      - name: Cache Rust (ARM 32 bits)
        uses: actions/cache@v4
        with:
          path: |
            .cargo-armhf/registry
            .cargo-armhf/git
            src-tauri/target
          key: armhf-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: armhf-
      - name: Paquets (conteneur Debian armv7)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm --platform linux/arm/v7 -e GITHUB_TOKEN -v "$PWD:/src" -w /src debian:bookworm \
            bash scripts/ci-build-armhf-container.sh
          sudo chown -R "$(id -u):$(id -g)" .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-armhf
          path: out/*

  release:
    name: Publication (brouillon)
    needs: [web, windows, linux, linux-armhf]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Sommes de contrôle
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.web.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Araç ${{ needs.web.outputs.version }}
          draft: true
          files: out/*
          body: |
            ## Araç ${{ needs.web.outputs.version }}

            **Windows** : `Arac_${{ needs.web.outputs.version }}_windows_x64-setup.exe` (la plupart des PC) ou `_arm64-setup.exe` (PC ARM).
            L'installateur demande la langue, le dossier d'installation, puis si vous voulez convertir des documents (installe LibreOffice).

            **Linux** : le plus simple est le script `Arac_${{ needs.web.outputs.version }}_install.sh` :
            `bash Arac_${{ needs.web.outputs.version }}_install.sh` — il reconnaît la distribution et le processeur et propose .deb, .rpm ou AppImage.
            Fichiers directs : `.deb` (Debian, Ubuntu, Mint…), `.rpm` (Fedora, openSUSE…), `.AppImage` (toutes distributions) —
            `x86_64` (PC), `aarch64` (ARM 64 bits), `armhf` (ARM 32 bits, Raspberry Pi).

            **Web** : `Arac_${{ needs.web.outputs.version }}_web.zip` à décompresser sur un hébergement ; voir le README pour l'intégrer dans une page.

