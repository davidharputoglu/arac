[package]
name = "arac"
version = "0.1.0"
description = "Araç - convertisseur universel de fichiers"
license = "GPL-3.0-or-later"
repository = "https://github.com/davidharputoglu/arac"
authors = ["David HARPUTOGLU"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "arac_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
sys-locale = "0.3"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
